# Configuration for ID vs Correctness Experiment
# Recreates Figure 6 from arXiv:2407.02678

# Model configuration
model:
  # name: "meta-llama/Meta-Llama-3-8B-Instruct"  # HuggingFace model ID
  # For local testing with low VRAM:
  name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  
  torch_dtype: "float16"  # float16, bfloat16, or float32
  device_map: "auto"  # auto, cuda:0, etc.

# Dataset configuration
dataset:
  name: "gsm8k"  # Options: "gsm8k", "asdiv", "addsub"
  subset: "main"  # GSM8K subset/config (ignored for ASDiv/AddSub)
  split: "test"  # Evaluation split (ASDiv default train; AddSub supports train/valid/test)
  n_samples: 500  # Number of samples to evaluate (null for all)

# Few-shot configuration
few_shot:
  min_shots: 0  # Minimum number of shots (baseline)
  max_shots: 10  # Maximum number of shots
  shot_step: 1  # Step size (1 = all shots, 2 = 0,2,4,6,8,10)
  sample_from: "train"  # Where to sample few-shot examples from

# Intrinsic dimension configuration
intrinsic_dim:
  eps_factor: 0.1  # Threshold factor: eps = max_attn * eps_factor
  target_token: "last"  # Which token position to measure ID for

# Output configuration
output:
  dir: "results/id_correctness"  # Output directory for results
  save_raw: true  # Save raw results (attention weights, etc.)
  save_plots: true  # Generate and save plots

# Misc
seed: 42
batch_size: 1  # Keep at 1 for variable sequence lengths
